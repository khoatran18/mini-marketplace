# Override bật HTTPS (PUBLIC_SCHEME=https): TLS cert tự ký/thật, redirect 80 -> 443, HSTS, CORS theo https.
# deploy.sh tự gộp file này khi PUBLIC_SCHEME=https. Thủ công: docker compose --env-file deploy/.env -f deploy/services.yml -f deploy/services.https.yml config
# Cert: scripts/gen-dev-certs.sh (tự ký, trình duyệt phải tin) hoặc cert thật đặt ở deploy/traefik/certs/local.{crt,key}.
services:
  traefik:
    ports:
      - {target: 443, published: 443, protocol: tcp, mode: ingress}
    volumes:
      - ./traefik/certs:/certs:ro
      - ./traefik/dynamic:/dynamic:ro
    command:
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      - --providers.file.filename=/dynamic/tls.yml
    deploy:
      labels:
        - traefik.http.routers.dashboard.entrypoints=websecure
        - traefik.http.routers.dashboard.tls=true
  frontend:
    deploy:
      labels:
        - traefik.http.routers.frontend.entrypoints=websecure
        - traefik.http.routers.frontend.tls=true
  api-gateway:
    environment:
      ALLOWED_ORIGINS: https://${PUBLIC_HOST:-marketplace.swarm.localhost}
    deploy:
      labels:
        - traefik.http.routers.api.entrypoints=websecure
        - traefik.http.routers.api.tls=true
        - traefik.http.middlewares.secure-headers.headers.stsIncludeSubdomains=true
        - traefik.http.middlewares.secure-headers.headers.stsSeconds=31536000
