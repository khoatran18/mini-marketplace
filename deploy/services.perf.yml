# CHỈ CHO MÔI TRƯỜNG THỬ TẢI (perf test). KHÔNG dùng ở production.
# Mục đích: cho phép mô phỏng nhiều IP client khác nhau bằng header X-Forwarded-For khi đi qua Traefik (ingress của Swarm).
# Vì sao cần: cổng 80 của Traefik publish kiểu ingress nên mọi client ngoài đều đến Traefik với địa chỉ 10.0.0.2 (mạng ingress), Traefik
# mặc định bỏ X-Forwarded-For của client, và gateway có TRUSTED_PROXIES rỗng nên bỏ qua header này (docs/planning/01_OPEN_ISSUES.md S8).
# Ngoài ra file này đặt giới hạn CPU/RAM và số replica cho đợt đo CCU (xem docs/design/09_PERF_RESOURCES.md), và nâng các giới hạn tốc độ để
# test đo hệ thống chứ không đo ra 429. Hạ tầng (postgres, redis, kafka, clickhouse) nằm ở deploy/infra.perf.yml.
# Hai thay đổi về IP:
#   1. Traefik tin X-Forwarded-For đến từ mạng ingress (10.0.0.0/24): giữ header của client và nối thêm 10.0.0.2.
#   2. Gateway tin proxy trong mạng ingress (10.0.0.0/24) và mạng marketplace-net (10.0.1.0/24): đọc IP client từ XFF.
# CẢNH BÁO: vì mọi client ngoài đều đến từ 10.0.0.2 nên MỌI người đều giả được IP (né giới hạn tốc độ). Đừng bật ngoài môi trường thử.
# Dải mạng lấy từ `docker network inspect ingress` / `marketplace-net` trên máy này; đổi nếu mạng của bạn khác.
# Áp dụng (giống scripts/deploy.sh, chỉ thêm file này): xem docs/instruction/04_TESTING.md hoặc lệnh trong mục kiểm tra bên dưới.
# Kiểm: gửi 2 yêu cầu với X-Forwarded-For khác nhau, X-RateLimit-Remaining của mỗi IP phải bắt đầu riêng (299) và Redis có khoá
# rate_limit:global:<IP giả> tương ứng.
services:
  traefik:
    # `command` bị GHI ĐÈ (không nối thêm) khi gộp file bằng docker compose 5.x, nên phải chép lại đủ cờ của services.yml (bản HTTP) và thêm cờ mới ở cuối.
    # Nếu sửa `command` của traefik trong services.yml thì sửa theo ở đây. Chỉ dùng với PUBLIC_SCHEME=http.
    command:
      - --entrypoints.web.address=:80
      - --providers.swarm.endpoint=unix:///var/run/docker.sock
      - --providers.swarm.exposedbydefault=false
      - --providers.swarm.network=marketplace-net
      - --api.dashboard=true
      - --api.insecure=false
      - --accesslog=true
      - --ping=true
      - --entrypoints.metrics.address=:8082
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics
      - --entrypoints.web.forwardedHeaders.trustedIPs=10.0.0.0/24
    deploy:
      resources:
        limits: {cpus: "0.7", memory: 512M}
  frontend:
    deploy:
      resources:
        limits: {cpus: "0.7", memory: 512M}
  api-gateway:
    environment:
      TRUSTED_PROXIES: 10.0.0.0/24,10.0.1.0/24
      # Nâng giới hạn tốc độ để không bị 429 trước khi đo được tài nguyên. Mỗi VU dùng IP giả riêng nên giới hạn theo IP vẫn còn tác dụng.
      RATE_LIMIT_PER_MINUTE: "100000"
      AUTH_RATE_LIMIT_PER_MINUTE: "100000"
      AI_RATE_LIMIT_PER_MINUTE: "100000"
      AI_USER_RATE_LIMIT_PER_MINUTE: "100000"
      AI_PROPOSAL_RATE_LIMIT_PER_MINUTE: "100000"
      EVENTS_RATE_LIMIT_PER_MINUTE: "100000"
    deploy:
      replicas: 2
      resources:
        limits: {cpus: "0.6", memory: 512M}
  auth-service:
    deploy:
      replicas: 5
      resources:
        limits: {cpus: "1", memory: 384M}
  product-service:
    environment:
      # 3 reader = 3 partition của order.create_order / order.status_changed: mỗi reader một partition, song song x3, thứ tự theo đơn vẫn giữ (R13)
      KAFKA_CONSUMER_WORKERS: "3"
    deploy:
      resources:
        limits: {cpus: "0.7", memory: 384M}
  order-service:
    deploy:
      resources:
        limits: {cpus: "0.8", memory: 384M}
  user-service:
    deploy:
      resources:
        limits: {cpus: "0.2", memory: 256M}
  payment-service:
    deploy:
      resources:
        limits: {cpus: "0.4", memory: 256M}
  analytics-service:
    deploy:
      resources:
        limits: {cpus: "0.3", memory: 256M}
  ops-service:
    deploy:
      resources:
        limits: {cpus: "0.2", memory: 96M}
  ai-agent:
    environment:
      # Mô hình GIẢ có độ trễ (ttft 800 ms, 60 token/s; profile trong services/ai-agent/configs/config.prod.yaml): không gọi LLM thật, tool vẫn gọi gateway thật.
      AI_LLM_ROLE_BUYER: fake_perf_buyer
      AI_LLM_ROLE_SELLER: fake_perf_seller
      AI_LLM_ROLE_ADMIN: fake_perf_admin
      AI_LLM_ROLE_OPERATOR: fake_perf_operator
    # Một tiến trình uvicorn dùng được tối đa 1 core (GIL), nên tăng song song bằng replica. Chỉ an toàn khi AI_RCA_ENABLED=false
    # (watcher RCA không có khoá chọn người dẫn đầu, nhiều replica sẽ điều tra trùng). Bước đầu đo với replicas: 1 rồi tính số replica cần.
    deploy:
      replicas: 2
      resources:
        limits: {cpus: "0.5", memory: 768M}
