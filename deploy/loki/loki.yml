# Loki single-binary, lưu filesystem (volume loki-data). Chạy với -config.expand-env=true nên ${LOKI_RETENTION} lấy từ env.
# Chỉ nằm trong overlay marketplace-net, KHÔNG publish cổng; Vector push vào :3100, Grafana query qua http://loki:3100.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: ${LOKI_RETENTION:-168h}
  # Chặn nhãn bùng nổ cardinality: Vector chỉ gửi service/stack/level/env.
  max_label_names_per_series: 8
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  max_query_series: 500
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  allow_structured_metadata: false
  # Tắt nhãn service_name tự thêm của Loki 3.x (đã có nhãn service từ Vector)
  discover_service_name: []
  discover_log_levels: false

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
  retention_delete_delay: 2h
  compaction_interval: 10m

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 50

analytics:
  reporting_enabled: false
