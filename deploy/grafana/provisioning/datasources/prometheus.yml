apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
  # Log (Loki, xem deploy/loki/loki.yml). Truy vấn qua LogQL; request_id KHÔNG phải nhãn nên lọc bằng | json.
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
  # Trace (Tempo, xem deploy/tempo/tempo.yml; ADR-36). Bật bằng OTEL_EXPORTER_OTLP_ENDPOINT ở các service.
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
