# Prometheus scrape configuration (Docker Swarm). Service discovery uses Swarm's `tasks.<service>` DNS,
# which returns one A record per running replica, so scaling a service needs no config change.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Our Go services: admin port :8081/metrics (gateway, auth, user, product, order, payment, analytics)
  # METRICS_TOKEN (optional bearer token on /metrics): observability.yml writes it to /tmp/metrics_token at container
  # start. Empty token = empty file = services are open and ignore the header (see docs/design/05_SECURITY.md).
  - job_name: mm-services
    authorization:
      type: Bearer
      credentials_file: /tmp/metrics_token
    dns_sd_configs:
      - names:
          - tasks.api-gateway
          - tasks.auth-service
          - tasks.user-service
          - tasks.product-service
          - tasks.order-service
          - tasks.payment-service
          - tasks.analytics-service
        type: A
        port: 8081
        refresh_interval: 15s
    relabel_configs:
      # `service` already comes from the metrics themselves; keep the swarm service name as a separate label for `up`
      - source_labels: [__meta_dns_name]
        regex: tasks\.(.*)
        target_label: swarm_service
        replacement: $1

  - job_name: cadvisor
    dns_sd_configs:
      - {names: [tasks.cadvisor], type: A, port: 8080, refresh_interval: 15s}

  - job_name: node-exporter
    dns_sd_configs:
      - {names: [tasks.node-exporter], type: A, port: 9100, refresh_interval: 15s}

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: kafka
    static_configs:
      - targets: ['kafka-exporter:9308']

  # ClickHouse server: endpoint Prometheus built-in (deploy/clickhouse/prometheus.xml, mount qua infra.yml)
  - job_name: clickhouse
    static_configs:
      - targets: ['clickhouse:9363']

  # Traefik (internal "metrics" entrypoint, not published)
  - job_name: traefik
    dns_sd_configs:
      - {names: [tasks.traefik], type: A, port: 8082, refresh_interval: 15s}

  # Loki (log store): /metrics trên cổng HTTP 3100 trong overlay
  - job_name: loki
    dns_sd_configs:
      - {names: [tasks.loki], type: A, port: 3100, refresh_interval: 15s}

  # Vector (mỗi node một bản): internal_metrics qua prometheus_exporter :9598 (xem deploy/vector/vector.yaml)
  - job_name: vector
    dns_sd_configs:
      - {names: [tasks.vector], type: A, port: 9598, refresh_interval: 15s}
