# Application stack. Requires infra.yml to be deployed first (shared external network).
# Build images first: scripts/build-images.sh
services:

  traefik:
    image: traefik:v3.6
    networks: [marketplace]
    ports:
      - {target: 80, published: 80, protocol: tcp, mode: ingress}
      - {target: 443, published: 443, protocol: tcp, mode: ingress}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/certs:/certs:ro
      - ./traefik/dynamic:/dynamic:ro
    command:
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      - --providers.file.filename=/dynamic/tls.yml
      - --providers.swarm.endpoint=unix:///var/run/docker.sock
      - --providers.swarm.exposedbydefault=false
      - --providers.swarm.network=marketplace-net
      - --api.dashboard=true
      - --api.insecure=false
      - --accesslog=true
      # liveness (traefik healthcheck --ping) and Prometheus metrics on an internal, unpublished entrypoint
      - --ping=true
      - --entrypoints.metrics.address=:8082
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      placement:
        constraints: [node.role == manager]
      labels:
        - traefik.enable=true
        - traefik.http.routers.dashboard.rule=Host(`dashboard.${PUBLIC_HOST:-marketplace.swarm.localhost}`)
        - traefik.http.routers.dashboard.entrypoints=websecure
        - traefik.http.routers.dashboard.service=api@internal
        - traefik.http.routers.dashboard.tls=true
        - traefik.http.routers.dashboard.middlewares=dashboard-auth
        - traefik.http.middlewares.dashboard-auth.basicauth.users=${TRAEFIK_DASHBOARD_USERS:?set TRAEFIK_DASHBOARD_USERS}
        - traefik.http.services.traefik.loadbalancer.server.port=8080

  frontend:
    image: marketplace/frontend:latest
    hostname: frontend
    networks: [marketplace]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      restart_policy: {condition: on-failure, delay: 10s}
      labels:
        - traefik.enable=true
        - traefik.http.routers.frontend.rule=Host(`${PUBLIC_HOST:-marketplace.swarm.localhost}`)
        - traefik.http.routers.frontend.entrypoints=websecure
        - traefik.http.routers.frontend.tls=true
        - traefik.http.services.frontend.loadbalancer.server.port=3000

  api-gateway:
    image: marketplace/api-gateway:latest
    hostname: api-gateway
    networks: [marketplace]
    environment: &svc_env
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_EXPIRE_TIME: ${JWT_EXPIRE_TIME:-5}
      REDIS_ADDR: redis:6379
      POSTGRES_DSN: host=postgres user=${POSTGRES_USER:-postgres} password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD} dbname=${POSTGRES_DB:-postgres} port=5432 sslmode=disable
      KAFKA_BROKERS_ADDR: broker1:9092
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      GIN_MODE: release
      KAFKA_PRODUCER_RETRY: ${KAFKA_PRODUCER_RETRY:-2}
      KAFKA_PRODUCER_BACKOFF: ${KAFKA_PRODUCER_BACKOFF:-100}
      KAFKA_CONSUMER_BACKOFF: ${KAFKA_CONSUMER_BACKOFF:-100}
      ALLOWED_ORIGINS: https://${PUBLIC_HOST:-marketplace.swarm.localhost}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-300}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-20}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-1048576}
      EVENTS_RATE_LIMIT_PER_MINUTE: ${EVENTS_RATE_LIMIT_PER_MINUTE:-120}
      IP_HASH_SECRET: ${IP_HASH_SECRET:-}
      # business rules read by order-service / payment-service (shared anchor, no secrets here)
      ENV: ${ENV:-prod}
      ORDER_PAYMENT_TTL_MIN: ${ORDER_PAYMENT_TTL_MIN:-15}
      RETURN_WINDOW_DAYS: ${RETURN_WINDOW_DAYS:-7}
      AUTO_DELIVER_DAYS: ${AUTO_DELIVER_DAYS:-7}
      SHIPPING_FLAT_FEE: ${SHIPPING_FLAT_FEE:-30000}
      FREE_SHIP_OVER: ${FREE_SHIP_OVER:-500000}
    # liveness only (never depends on other services); readiness (/ready) is used by Traefik below
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    deploy:
      replicas: 2
      restart_policy: {condition: on-failure, delay: 10s}
      resources:
        limits: {memory: 384M}
      labels:
        - traefik.enable=true
        - traefik.http.routers.api.rule=Host(`api.${PUBLIC_HOST:-marketplace.swarm.localhost}`)
        - traefik.http.routers.api.entrypoints=websecure
        - traefik.http.routers.api.tls=true
        - traefik.http.services.api.loadbalancer.server.port=8080
        - traefik.http.services.api.loadbalancer.healthcheck.path=/ready
        - traefik.http.services.api.loadbalancer.healthcheck.port=8081
        - traefik.http.services.api.loadbalancer.healthcheck.interval=5s
        - traefik.http.services.api.loadbalancer.healthcheck.timeout=2s
        - traefik.http.routers.api.middlewares=secure-headers
        - traefik.http.middlewares.secure-headers.headers.frameDeny=true
        - traefik.http.middlewares.secure-headers.headers.browserXssFilter=true
        - traefik.http.middlewares.secure-headers.headers.contentTypeNosniff=true
        - traefik.http.middlewares.secure-headers.headers.stsIncludeSubdomains=true
        - traefik.http.middlewares.secure-headers.headers.stsSeconds=31536000

  auth-service:
    image: marketplace/auth-service:latest
    hostname: auth-service
    networks: [marketplace]
    environment:
      <<: *svc_env
      # only auth-service needs these (never put the admin password in the shared env anchor)
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    deploy:
      replicas: 1
      restart_policy: {condition: on-failure, delay: 10s}
      resources:
        limits: {memory: 256M}

  user-service:
    image: marketplace/user-service:latest
    hostname: user-service
    networks: [marketplace]
    environment: *svc_env
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    deploy:
      replicas: 1
      restart_policy: {condition: on-failure, delay: 10s}
      resources:
        limits: {memory: 256M}

  product-service:
    image: marketplace/product-service:latest
    hostname: product-service
    networks: [marketplace]
    environment: *svc_env
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    deploy:
      replicas: 1
      restart_policy: {condition: on-failure, delay: 10s}
      resources:
        limits: {memory: 256M}

  order-service:
    image: marketplace/order-service:latest
    hostname: order-service
    networks: [marketplace]
    environment: *svc_env
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    deploy:
      replicas: 1
      restart_policy: {condition: on-failure, delay: 10s}
      resources:
        limits: {memory: 256M}

  # SIMULATED payment provider (no real payment network is ever contacted)
  payment-service:
    image: marketplace/payment-service:latest
    hostname: payment-service
    networks: [marketplace]
    environment:
      <<: *svc_env
      PAYMENTS_MODE: mock
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?set PAYMENT_WEBHOOK_SECRET (at least 16 characters)}
      MOCK_WEBHOOK_DELAY_MS: ${MOCK_WEBHOOK_DELAY_MS:-3000}
      MOCK_TRANSFER_DELAY_MS: ${MOCK_TRANSFER_DELAY_MS:-8000}
      MOCK_TIMEOUT_DELAY_MS: ${MOCK_TIMEOUT_DELAY_MS:-30000}
      PAYMENT_CHAOS_RATE: ${PAYMENT_CHAOS_RATE:-0}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    deploy:
      replicas: 1
      restart_policy: {condition: on-failure, delay: 10s}
      resources:
        limits: {memory: 256M}

  # Analytics: Kafka domain events + browser tracking -> ClickHouse; answers the seller/admin dashboards
  analytics-service:
    image: marketplace/analytics-service:latest
    hostname: analytics-service
    networks: [marketplace]
    environment:
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS_ADDR: broker1:9092
      KAFKA_CONSUMER_BACKOFF: ${KAFKA_CONSUMER_BACKOFF:-100}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-marketplace}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}
      ANALYTICS_CACHE_TTL_SEC: ${ANALYTICS_CACHE_TTL_SEC:-30}
      ANALYTICS_FLUSH_INTERVAL_MS: ${ANALYTICS_FLUSH_INTERVAL_MS:-2000}
      ANALYTICS_FLUSH_ROWS: ${ANALYTICS_FLUSH_ROWS:-5000}
      ANALYTICS_BUFFER_MAX_ROWS: ${ANALYTICS_BUFFER_MAX_ROWS:-100000}
      EVENTS_RETENTION_MONTHS: ${EVENTS_RETENTION_MONTHS:-13}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    deploy:
      replicas: 1
      restart_policy: {condition: on-failure, delay: 10s}
      resources:
        limits: {memory: 256M}

networks:
  marketplace:
    name: marketplace-net
    external: true
