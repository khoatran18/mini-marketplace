name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, auth-service, user-service, product-service, order-service, payment-service, analytics-service]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_SKIP_USER_SETUP: "1"
        ports: ["8123:8123"]
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping" --health-interval 5s --health-timeout 3s --health-retries 15
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/${{ matrix.service }}/go.mod
          cache-dependency-path: services/${{ matrix.service }}/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l . | grep -v '\.pb\.go$')" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go build ./...
      - name: Test
        env:
          TEST_POSTGRES_DSN: host=localhost port=5432 user=postgres password=postgres sslmode=disable
          TEST_CLICKHOUSE_URL: http://localhost:8123
        run: go test -race -count=1 ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [go]
    strategy:
      fail-fast: false
      matrix:
        context: [services/api-gateway, services/auth-service, services/user-service, services/product-service, services/order-service, services/payment-service, services/analytics-service, apps/frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
