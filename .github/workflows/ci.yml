name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Quyền mặc định tối thiểu; job push image tự nâng lên packages: write
permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, auth-service, user-service, product-service, order-service, payment-service, analytics-service]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_SKIP_USER_SETUP: "1"
        ports: ["8123:8123"]
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping" --health-interval 5s --health-timeout 3s --health-retries 15
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/${{ matrix.service }}/go.mod
          cache-dependency-path: services/${{ matrix.service }}/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l . | grep -v '\.pb\.go$')" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go build ./...
      - name: Test
        env:
          TEST_POSTGRES_DSN: host=localhost port=5432 user=postgres password=postgres sslmode=disable
          TEST_CLICKHOUSE_URL: http://localhost:8123
        run: go test -race -count=1 ./...

  # Module dùng chung shared/ (ops, events, messagequeue; ADR-33): test một lần, không lặp ở từng service
  shared:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: shared/go.mod
          cache-dependency-path: shared/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: Test
        env:
          TEST_POSTGRES_DSN: host=localhost port=5432 user=postgres password=postgres sslmode=disable
        run: go test -race -count=1 ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build

  # Kiểm tra cú pháp compose + shellcheck (không cần Docker daemon/Swarm)
  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config (3 file deploy)
        run: |
          # env giả lấy từ .env.example (không có secret thật)
          cp deploy/.env.example /tmp/ci.env
          # biến bắt buộc (:?) mà .env.example để trống -> điền giá trị giả cho CI
          printf '%s\n' 'TRAEFIK_DASHBOARD_USERS=admin:$$apr1$$fake$$fake' 'JWT_SECRET=ci-fake-secret' >> /tmp/ci.env
          for f in infra observability services; do
            docker compose --env-file /tmp/ci.env -f "deploy/$f.yml" config -q
          done
      - name: shellcheck scripts
        run: |
          # shellcheck có sẵn trên ubuntu-latest
          shellcheck -S warning scripts/*.sh scripts/protogen/*.sh

  docker:
    runs-on: ubuntu-latest
    needs: [go, shared]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {context: ., file: services/api-gateway/Dockerfile}
          - {context: ., file: services/auth-service/Dockerfile}
          - {context: ., file: services/user-service/Dockerfile}
          - {context: ., file: services/product-service/Dockerfile}
          - {context: ., file: services/order-service/Dockerfile}
          - {context: ., file: services/payment-service/Dockerfile}
          - {context: ., file: services/analytics-service/Dockerfile}
          - {context: apps/frontend, file: apps/frontend/Dockerfile}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Đẩy image lên GHCR: chỉ khi push lên main hoặc tag v* (không chạy cho PR)
  push-images:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    needs: [go, shared, frontend, docker, compose-validate]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: api-gateway, context: ., file: services/api-gateway/Dockerfile}
          - {name: auth-service, context: ., file: services/auth-service/Dockerfile}
          - {name: user-service, context: ., file: services/user-service/Dockerfile}
          - {name: product-service, context: ., file: services/product-service/Dockerfile}
          - {name: order-service, context: ., file: services/order-service/Dockerfile}
          - {name: payment-service, context: ., file: services/payment-service/Dockerfile}
          - {name: analytics-service, context: ., file: services/analytics-service/Dockerfile}
          - {name: frontend, context: apps/frontend, file: apps/frontend/Dockerfile}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          # GHCR yêu cầu tên viết thường
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=sha,format=short,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
