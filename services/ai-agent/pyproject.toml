[project]
name = "ai-agent"
version = "0.1.0"
description = "Mini Marketplace AI agent service (buyer, seller; dev/admin later)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"
