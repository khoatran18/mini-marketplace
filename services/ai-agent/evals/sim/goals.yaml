# Mục tiêu cho người dùng GIẢ LẬP (hy4-flash-free đóng vai). Mỗi mục tiêu là một cuộc trò chuyện nhiều lượt do mô hình tự viết.
# persona, goal (mô tả cho người giả lập, tiếng Việt), style (cách nhắn), tool (đạt nếu gọi MỘT trong các tool này; bỏ trống = không đòi),
# propose (hành động phải được đề xuất; "none" = KHÔNG được đề xuất), deny (regex không được xuất hiện trong câu trả lời), max_turns, down (service đang treo).
