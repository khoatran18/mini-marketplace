# Bộ eval RCA (offline; `run_rca_evals.py --live` là thứ DUY NHẤT gọi LLM). Mỗi case là một sự cố có đáp án đúng:
#   scenario  chữ của kịch bản trong scripts/e2e/resilience.sh (đáp án do chính script gây lỗi biết chắc); null = biến thể dựng tay theo playbook
#   incident  sự cố mà ops-service đã mở từ alert (agent chỉ thấy các trường này)
#   tools     kết quả mà công cụ đọc trả (gateway giả). entry: {tool, match, before, after?}
#             ops_metrics_query: before/after là danh sách [nhãn, giá trị]; ops_system_health: before/after là {thành phần: trạng thái} (còn lại coi là ổn);
#             ops_outbox_dead và tool khác: object trả nguyên văn. "after" = trạng thái SAU khi hành động chạy (để thử verify); thiếu = giữ "before".
#   expect    cause_any (regex; một giả thuyết trong top-3 khớp MỘT) hoặc cause_all (một giả thuyết khớp TẤT CẢ);
#             playbook (id mà agent phải mở); action {id, params} hoặc action_any [..]; forbid [{id, params?}];
#             outcome (recovered | escalated); max_model_calls; cause_example (câu mẫu cho bộ oracle, phải khớp regex)
# Hành động đúng = hành động trong sổ gắn với bước sửa của playbook (scale-up -> scale_service, force-restart -> restart_service,
# inspect-then-requeue -> requeue_outbox, backfill -> run_backfill); bước sửa nằm ngoài sổ (hạ tầng, SQL, báo người) -> escalate_to_human.

- id: C-payment-down
  scenario: C
  incident: {id: 101, alert_name: ServiceDown, severity: critical, component: payment-service, summary: "payment-service không scrape được", labels: {service: payment-service}, state: open}
  tools:
    - {tool: ops_metrics_query, match: {name: service_up, service: payment-service}, before: [[{service: payment-service}, 0]], after: [[{service: payment-service}, 1]]}
    - {tool: ops_metrics_query, match: {name: service_replicas_up, service: payment-service}, before: [[{service: payment-service}, 0]], after: [[{service: payment-service}, 1]]}
    - {tool: ops_system_health, before: {payment-service: "down: 0/1 replica"}, after: {}}
  expect:
    cause_any: ["payment-service.*(0|dừng|down|không chạy|replica)", "scaled?-to-zero"]
    cause_example: "payment-service đang ở 0 replica (đã bị scale về 0)"
    playbook: service-unavailable
    action: {id: scale_service, params: {service: payment-service, replicas: 1}}
    forbid: [{id: restart_service}]
    outcome: recovered
    max_model_calls: 12

