- {g: filter, q: "Tai nghe nào rẻ nhất?", tool: search_products, args: {q: "*", sort: price_asc}, max: 1}
- {g: filter, q: "Điện thoại bán chạy nhất", tool: search_products, args: {q: "*", sort: best_selling}, max: 1}
- {g: filter, q: "Sản phẩm mới nhất của shop", tool: search_products, args: {sort: newest}, max: 1}
- {g: filter, q: "Laptop dưới 15 triệu", tool: search_products, args: {q: "*", price_max: 15000000}, max: 1}
- {g: filter, q: "Giày từ 500 nghìn đến 1 triệu", tool: search_products, args: {q: "*", price_min: 500000, price_max: 1000000}, max: 1}
- {g: filter, q: "Chuột không dây còn hàng", tool: search_products, args: {q: "*", in_stock: "true"}, max: 1}
- {g: filter, q: "Sản phẩm hãng Samsung", tool: search_products, args: {brand: "*"}, max: 1}
- {g: filter, q: "Đồ gia dụng đắt nhất", tool: search_products, args: {sort: price_desc}, max: 1}
- {g: filter, q: "Đơn đã giao và trả bằng thẻ", tool: list_my_orders, args: {status: DELIVERED, payment_method: MOCK_CARD}, max: 1}
