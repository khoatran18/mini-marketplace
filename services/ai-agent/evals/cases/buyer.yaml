- {g: lookup, q: "Sản phẩm 9 còn hàng không?", tool: get_product_stock, args: {id: 9}}
- {g: lookup, q: "Mặt hàng id 33 còn bao nhiêu cái?", tool: get_product_stock, args: {id: 33}}
- {g: lookup, q: "Thanh toán ở đây có những cách nào?", tool: list_payment_methods}
- {g: lookup, q: "Mình trả bằng ví điện tử được không?", tool: list_payment_methods}
- {g: lookup, q: "Quy định hủy đơn của shop thế nào?", tool: get_shop_rules}
- {g: lookup, q: "Bao lâu thì đơn chưa thanh toán bị hết hạn?", tool: get_shop_rules}
