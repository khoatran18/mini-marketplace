- {g: lookup, q: "Đơn 78 bao giờ giao tới?", tool: get_my_order, args: {id: 78}}
- {g: lookup, q: "Giỏ hàng của tôi đang có gì?", tool: get_cart}
- {g: lookup, q: "Trong giỏ có mấy món rồi?", tool: get_cart}
- {g: lookup, q: "Shop có những danh mục nào?", tool: list_categories}
