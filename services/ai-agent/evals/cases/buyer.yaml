- {g: lookup, q: "Phí vận chuyển tính thế nào?", tool: get_shop_rules}
- {g: lookup, q: "Đơn gần nhất của tôi là đơn nào?", tool: list_my_orders, args: {sort: newest, page_size: "*"}}
- {g: lookup, q: "Đơn cũ nhất của mình là đơn nào", tool: list_my_orders, args: {sort: oldest}}
- {g: lookup, q: "Mình đã đặt bao nhiêu đơn rồi nhỉ", tool: count_my_orders}
