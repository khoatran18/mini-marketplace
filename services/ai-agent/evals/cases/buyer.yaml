- {g: filter, q: "Đơn tháng trước của mình", tool: list_my_orders, args: {created_from: "@last_month_start", created_to: "@last_month_end"}, max: 1}
- {g: filter, q: "Đơn nào trên 1 triệu?", tool: list_my_orders, args: {min_total: 1000000}, max: 1}
