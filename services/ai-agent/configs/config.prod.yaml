# Cấu hình ai-agent cho môi trường prod. KHÔNG đặt secret ở đây: dùng ${TÊN_BIẾN:-} và đặt giá trị trong .env / deploy/.env.
# Nạp bởi ai_agent/config/loader.py theo APP_ENV (mặc định dev).
app:
  name: ai-agent
  env: prod
  log_level: INFO

server:
  host: "0.0.0.0"
  port: 8090

# Chỉ gateway gọi được ai-agent (mạng nội bộ Swarm, không publish cổng). ai-agent gọi ngược gateway bằng TOKEN AGENT.
gateway:
  base_url: "${GATEWAY_URL:-http://api-gateway:8080}"
  timeout_sec: 5            # mỗi lần gọi tool
  tools_cache_ttl_sec: 60   # danh sách tool (GET /ai/tools) theo role, lưu tạm trong bộ nhớ

llm:
  # profile = một mô hình đã cấu hình xong. role = chỗ dùng -> tên profile (đổi mô hình của persona = đổi một dòng ở roles).
  profiles:
    # Mô hình giả có kịch bản: không gọi mạng. Dùng cho dev/CI/test an toàn.
    fake_buyer:
      provider: "fake"
      script:                # bước k = lần gọi mô hình thứ k trong MỘT lượt chat
        - tool_calls:
            - {name: list_my_orders, args: {page_size: 3}}
        - content: "Đây là các đơn gần đây của bạn. Mình đã hiện chi tiết ở thẻ bên dưới."
    fake_seller:
      provider: "fake"
      script:
        - tool_calls:
            - {name: count_store_orders, args: {}}
        - content: "Mình đã tra số đơn theo trạng thái của shop. Chi tiết ở thẻ bên dưới."
    fake_text:
      provider: "fake"
      script:
        - content: "Xin chào! Mình có thể giúp gì cho bạn?"

    # DeepSeek qua API tương thích OpenAI (provider openai + base_url). model_id theo tài liệu hiện hành của nhà cung cấp.
    deepseek_flash:
      provider: "openai"
      model_id: "deepseek-chat"          # kiểm tra lại tên mô hình hiện hành trước khi dùng thật
      api_key: "${DEEPSEEK_API_KEY:-}"
      base_url: "${DEEPSEEK_BASE_URL:-https://api.deepseek.com}"
      temperature: 0
      timeout: 60
      max_retries: 2                     # tầng thử lại duy nhất (SDK, có backoff); breaker ở llm.resilience
      stream_usage: true                 # streaming qua base_url tuỳ chỉnh mặc định không trả usage; cần để đếm token
      # extra_body: {thinking: {type: "disabled"}}   # tắt suy luận cho rẻ/nhanh (kiểm tra tài liệu nhà cung cấp)
      limits: {rpm: 60, tpm: 200000}     # ghi theo tài liệu nhà cung cấp; chưa dùng ở bản này
    # OpenCode Go (cổng mô hình tương thích OpenAI): https://opencode.ai/docs/go . Đã kiểm 2026-11-14 bằng curl: stream, usage, tool_calls đều chạy.
    # OpenCode đòi client tự nhận diện bằng User-Agent riêng và gửi mã phiên ổn định trong header x-opencode-session.
    opencode_deepseek_flash:
      provider: "openai"
      model_id: "deepseek-v4.1-flash"
      api_key: "${OPENCODE_API_KEY:-}"
      base_url: "${OPENCODE_BASE_URL:-https://opencode.ai/inference/go/openai/v1}"
      temperature: 0
      timeout: 60
      max_retries: 2                     # tầng thử lại duy nhất (SDK, có backoff); breaker ở llm.resilience
      stream_usage: true                 # cần để đếm token; OpenCode nhận stream_options.include_usage (đã kiểm)
      default_headers: {User-Agent: "mini-marketplace-agent/0.1"}
      session_header: "x-opencode-session"   # giá trị = conversation_id của lượt chat (gắn lúc gửi request)
      extra_body: {thinking: {type: "disabled"}}   # tắt suy luận: nhanh và rẻ hơn (đã kiểm: reasoning_tokens = 0). Bỏ dòng này để bật lại
    claude_haiku:
      provider: "anthropic"
      model_id: "<điền model id>"
      api_key: "${ANTHROPIC_API_KEY:-}"
      temperature: 0

  # Chịu lỗi nhà cung cấp (llm/resilience.py): breaker theo profile + model dự phòng. Thử lại chỉ ở SDK (`max_retries` của profile), không thử lại chồng thêm.
  resilience:
    enabled: true
    failure_ratio: 0.5       # tỷ lệ lỗi trong cửa sổ để ngắt
    min_calls: 6             # tối thiểu số lần gọi trong cửa sổ mới xét
    window_sec: 60
    open_sec: 30             # ngắt bao lâu thì cho thăm dò
    probes: 1                # số lượt thăm dò cùng lúc khi half-open
  # role -> danh sách profile dự phòng theo thứ tự (rỗng = không có). Profile dự phòng phải hỗ trợ tool calling nếu role cần tool.
  fallbacks: {}

  roles:
    buyer: "opencode_deepseek_flash"
    seller: "opencode_deepseek_flash"
    admin: "opencode_deepseek_flash"
    operator: "opencode_deepseek_flash"
    rca: "opencode_deepseek_flash"          # điều tra sự cố (rca/); tách khỏi operator để đổi mô hình riêng
    summarizer: "opencode_deepseek_flash"   # chưa dùng

# Giới hạn cứng cho MỘT lượt chat (không phải cả cuộc trò chuyện). Hết giới hạn thì dừng và báo, không âm thầm hạ chất lượng.
limits:
  max_model_calls: 6          # số vòng gọi mô hình (tìm không ra thì model thử lại 1-2 lần rồi mới trả lời)
  max_tool_calls: 8
  turn_timeout_sec: 60        # gateway cắt cứng ở 120 s (AI_STREAM_TIMEOUT_SEC)
  tool_result_max_chars: 6000 # kết quả tool đưa cho mô hình bị cắt theo ngưỡng này
  tool_result_max_items: 20   # danh sách dài hơn thì chỉ giữ ngần này phần tử
  # Đề xuất ma (guard/ghost.py): câu trả lời nói đã soạn đề xuất/bấm Xác nhận mà lượt không tạo đề xuất nào. off = tắt; log = ghi log + số liệu mm_ai_ghost_proposals_total; notice = thêm cả một dòng báo cho người dùng.
  ghost_proposal: notice
  max_message_chars: 2000     # độ dài tối đa một tin người dùng
  max_history_messages: 20    # số tin cũ nạp lại cho mô hình
  token_budget_per_turn: 20000  # tổng token (vào + ra) tối đa một lượt; cần usage_metadata từ mô hình
  # Hạn mức token MỖI NGÀY cho mỗi người dùng, theo persona (vào + ra, ngày tính theo giờ Việt Nam, làm mới 00:00). 0 hoặc thiếu = không giới hạn.
  # Một lượt tối đa token_budget_per_turn nên hạn mức có thể vượt tối đa một lượt. Hết hạn mức: 429 code=daily_token_limit, không gọi mô hình.
  # Trần riêng cho persona có prompt/kết quả tool lớn (admin, operator gọi nhiều tool đọc trong một lượt); thiếu = dùng token_budget_per_turn.
  token_budget_by_persona:
    buyer: 32000
    seller: 35000
    admin: 45000
    operator: 45000
  daily_tokens:
    buyer: 150000
    seller: 200000
    admin: 400000
    operator: 400000

personas:
  buyer: {enabled: true}
  seller: {enabled: true}
  admin: {enabled: true}
  operator: {enabled: true}
  rca: {enabled: true}      # vòng lặp điều tra sự cố (rca/), chạy bằng token operator

# Kho lịch sử chat (xem store/postgres.py). Bảng ai_* nằm cùng cụm Postgres với các service khác.
store:
  # memory = trong bộ nhớ (mất khi restart; dùng cho test). postgres = lưu bền, giữ retention_days ngày rồi tự xoá.
  backend: "postgres"
  retention_days: 30
  postgres:
    host: "${POSTGRES_HOST:-postgres}"
    port: 5432
    user: "${POSTGRES_USER:-postgres}"
    password: "${POSTGRES_PASSWORD:-}"
    database: "${POSTGRES_DB:-postgres}"

# Vòng lặp RCA (rca/, ADR-46): ngân sách MỘT sự cố. Thiếu khoá = dùng mặc định trong rca/budget.py.
rca:
  enabled: "${AI_RCA_ENABLED:-false}"   # bật = dựng RCA khi khởi động (bảng ai_rca_runs, checkpoint, bộ theo dõi). Cần AI_SYSTEM_KEY để chạy được (ADR-47)
  system_key: "${AI_SYSTEM_KEY:-}"   # khớp AI_SYSTEM_KEY của gateway; rỗng = không có danh tính hệ thống (không tự chạy, nút Điều tra báo 503)
  retention_days: 30          # xoá phiên đã xong/lỗi (kèm nhật ký, checkpoint) sau số ngày này; 0 = giữ mãi. Phiên đang chờ không bị xoá
  max_concurrent: 2           # số phiên chạy cùng lúc
  max_rounds: 3               # vòng collect -> hypothesize -> decide
  max_model_calls: 12
  collect_model_calls: 12     # trần lượt gọi mô hình của MỘT vòng thu bằng chứng (chat chỉ 6 nên cạn khi RCA đọc playbook + chạy truy vấn)
  collect_tool_calls: 12      # trần lượt gọi công cụ của một vòng thu bằng chứng
  max_tool_errors: 3          # công cụ lỗi liên tiếp từng này lần thì dừng thu bằng chứng, khỏi đốt lượt gọi
  max_queries: 25             # số lần gọi tool đọc
  max_seconds: 300
  max_hypotheses: 3
  confident_at: 0.6           # giả thuyết đầu từ mức này thì đủ tin cậy để đề xuất
  max_pending_proposals: 2    # đề xuất PENDING tối đa cho một sự cố
  verify_retries: 1           # verify thất bại: thêm đúng một vòng điều tra rồi báo người
  verify_wait_sec: 180        # chờ sau khi hành động chạy xong rồi mới verify
  wait_timeout_sec: 1800      # chờ người (xác nhận, duyệt) tối đa 30 phút
  poll_interval_sec: 30       # bộ theo dõi hỏi ops-service (không gọi LLM)
  daily_tokens: 0             # trần tổng token (vào + ra) của mọi phiên RCA trong 24 giờ; chạm trần thì không tự chạy phiên mới (bấm tay vẫn chạy). 0 = không giới hạn
  usd_per_mtok_in: 0          # đơn giá USD cho 1 triệu token vào, để quy ra tiền (mm_ai_rca_cost_usd_total); 0 = không tính
  usd_per_mtok_out: 0
  auto_critical: true         # alert critical: agent tự vào điều tra (bằng danh tính hệ thống, ADR-47)
  daily_auto_runs: "${AI_RCA_DAILY_AUTO_RUNS:-10}"   # trần số phiên tự chạy mỗi ngày; 0 = không bao giờ tự chạy (bấm tay vẫn chạy)

