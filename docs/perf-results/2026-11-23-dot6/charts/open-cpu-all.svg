<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" font-family="system-ui,Segoe UI,Roboto,sans-serif">
<rect width="1120" height="560" fill="#fcfcfb"/>
<text x="16" y="28" font-size="18" font-weight="600" fill="#0b0b0b">CPU mọi service trên một biểu đồ, theo mức tải mở (% so với trần)</text>
<text x="16" y="48" font-size="12" fill="#52514e">Y = mức dùng / trần được cấp (%), nên trần của mọi service là cùng một đường nét đứt ở 100%. Service có màu = 7 service chính; xám = còn lại (chỉ ghi tên nếu ở mức tải cuối quá 60% trần).</text>
<text x="16" y="68" font-size="12" fill="#52514e">Đường liền = ĐỈNH CPU của bản bận nhất / trần mỗi bản (mẫu 3 s); đường chấm = CPU trung bình. Vòng đỏ = mức tải bị throttle >= 10% chu kỳ CPU.</text>
